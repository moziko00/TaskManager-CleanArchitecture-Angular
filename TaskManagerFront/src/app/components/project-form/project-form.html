<div class="container mt-5">

    <div class="card">

        <div class="card-header bg-primary text-white">
            <h3>{{ isEdit ? 'Edit Project' : 'Add Project' }}</h3>
        </div>

        <div class="card-body">

            <div class="mb-3">

                <label>Name</label>

                <input
    type="text"
    class="form-control"
    name="name"
    [(ngModel)]="project.name">

            </div>

            <div class="mb-3">

                <label>Description</label>

                <textarea rows="4" 
                class="form-control" 
                name="description"
                [(ngModel)]="project.description">
                </textarea>
            </div>

            <button
                class="btn btn-success"
                (click)="saveProject()">

                Save

            </button>

        </div>

    </div>

</div>
